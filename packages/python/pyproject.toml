[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "benchmark-protocol-contract"
version = "0.6.0"
description = "Private pre-alpha bindings for the benchmark protocol"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.32,<0.33",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/benchmark_protocol/generated"]

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "ERA",
  "F",
  "I",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "RUF",
  "S",
  "SIM",
  "T10",
  "UP",
  "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["benchmark_protocol"]
