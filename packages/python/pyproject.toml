[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "benchmark-protocol-contract"
version = "0.2.0"
description = "Private pre-alpha bindings for the benchmark protocol"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.32,<0.33",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["benchmark_protocol"]
